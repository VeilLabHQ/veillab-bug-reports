name: Veil Lab Bug Report
description: Minimal English bug report for fast triage
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short. Do not include API keys, passwords, cookies, tokens, payment data, or verification codes.
  - type: input
    id: summary
    attributes:
      label: What happened?
      placeholder: "Example: top-up button is missing / /v1/responses returns 404"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Which page or API?
      placeholder: "Example: /console/topup, /pricing, /v1/responses"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot, logs, or Request ID (optional)
      description: Remove secrets before posting.
