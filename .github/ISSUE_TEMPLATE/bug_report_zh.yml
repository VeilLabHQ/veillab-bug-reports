name: Veil Lab 中文 Bug 报告
description: 面向中文用户的最小 Bug 反馈表单，方便快速分诊
title: "[Bug][中文]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量简短。不要提交 API Key、密码、Cookie、Token、支付信息或验证码。
  - type: input
    id: summary
    attributes:
      label: 你遇到了什么？
      placeholder: "例如：充值页按钮不显示 / /v1/responses 返回 404"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 在哪个页面或 API？
      placeholder: "例如：/console/topup、/pricing、/v1/responses"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 怎么复现？
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、日志或 Request ID（可选）
      description: 提交前请先脱敏。
